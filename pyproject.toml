[project]
name = "shao-wang-me"
version = "0.0.0"
description = "Shao Wang's personal notes website"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "babel",
    "beautifulsoup4",
    "cairosvg",
    "mdx-breakless-lists",
    "mkdocs",
    "mkdocs-awesome-pages-plugin",
    "mkdocs-callouts",
    "mkdocs-custom-tags-attributes",
    "mkdocs-embed-file-plugin",
    "mkdocs-encryptcontent-plugin",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-glightbox",
    "mkdocs-material",
    "mkdocs-meta-descriptions-plugin",
    "mkdocs-obsidian-links",
    "obsidiantools",
    "pillow",
    "python-dateutil",
    "pyvis",
    "pyyaml",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
exclude = ["docs", "site"]
